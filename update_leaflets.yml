name: Update Leaflets Aggregator

on:
  schedule:
    - cron: '0 6 * * 1'  # Spustí sa každý pondelok o 6:00 ráno UTC
  workflow_dispatch:      # Umožňuje spustenie aj manuálne jedným klikom z webu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Klonovanie repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Inštalácia závislostí
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Spustenie agregátora
        run: python aggregator.py

      - name: Automatický commit a push aktualizovaného JSONu
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leaflets.json
          git commit -m "chore: automatická aktualizácia leaflets.json [skip ci]" || exit 0
          git push
